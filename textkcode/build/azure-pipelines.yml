trigger:
  branches:
    include:
      - main
      - release/*

variables:
  YARN_CACHE_FOLDER: $(Pipeline.Workspace)/.yarn
  NODE_VERSION: '18.x'

stages:
  - stage: Build
    displayName: Build KCode
    jobs:
      - job: linux
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - script: |
              corepack enable
              yarn install --frozen-lockfile
              yarn compile
              yarn test --runInBand
              yarn package --linux
            displayName: Build Linux artifacts

      - job: mac
        pool:
          vmImage: 'macos-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - script: |
              corepack enable
              yarn install --frozen-lockfile
              yarn compile
              yarn test --runInBand
              yarn package --mac
            displayName: Build macOS artifacts

      - job: windows
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - powershell: |
              corepack enable
              yarn install --frozen-lockfile
              yarn compile
              yarn test --runInBand
              yarn package --win
            displayName: Build Windows artifacts
